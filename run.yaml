setup_commands:
  - "pip install -r requirements.txt"

run_commands:
  - "python src/main.py demo --out sample_videos"

test_commands: []

notes: "CPU only, ~1 minute. No corpus was provided, so the demo generates synthetic clips, trains, reports held-out accuracy and writes src/model.json. For real data: python src/main.py train DATA_DIR (DATA_DIR/<class>/*.mp4), then python src/main.py classify VIDEO. See docs/design.md."
